<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAMBISTELLA Mini App</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <h1>CAMBISTELLA</h1>
    <p>Professional Chemical & Cosmetic Formula Store</p>
</header>

<nav class="navbar">
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Cart</a>
    <a href="#">Contact</a>
</nav>

<section class="hero">
    <h2>Premium Formula Store</h2>
    <p>Professional Laundry, Dishwash, Body Wash, Shampoo & Cosmetic Formulas</p>

    <button id="shopBtn">
        Shop Now
    </button>
</section>

<section class="products">

<h2>Popular Products</h2>
<div class="search-box">

<input
type="text"
id="search"
placeholder="Search Product">

<select id="category">

<option value="all">All Categories</option>

<option value="Dishwashing">Dishwashing</option>

<option value="Laundry">Laundry</option>

<option value="Fabric Care">Fabric Care</option>

<option value="Body Care">Body Care</option>

<option value="Home Care">Home Care</option>

<option value="Car Care">Car Care</option>

<option value="Industrial">Industrial</option>

</select>

</div>
<div id="product-list">

</div>

</section>

<section class="cart">

<h2>Shopping Cart</h2>

<div id="cart-items">

No items

</div>

<h3 id="total">
Total : $0.00
</h3>

<button id="checkoutBtn">
Checkout
</button>

</section>

<script src="script.js"></script>

</body>
</html>
